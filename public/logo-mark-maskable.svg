<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Reflow">
  <!-- Variante « maskable » : le même signe, resserré dans le cercle de
       sécurité de 40 % et allégé d'un palier — Android recadre l'icône à sa
       guise, et un dessin calé sur les bords y perd ses angles. -->
  <rect width="512" height="512" fill="#0b0d12"/>
  <rect x="150" y="166" width="176" height="136" fill="none" stroke="#9d7bff" stroke-width="14"/>
  <rect x="210" y="218" width="192" height="150" fill="#141824" stroke="#7b8398" stroke-width="10"/>
  <rect x="228" y="330" width="70" height="12" fill="#2b3247"/>
  <rect x="228" y="330" width="70" height="4" fill="#9d7bff"/>
  <rect x="236" y="304" width="22" height="26" fill="#ffffff"/>
  <rect x="330" y="304" width="22" height="26" fill="none" stroke="#a3e635" stroke-width="6"/>
</svg>
